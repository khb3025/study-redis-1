spring:
    profiles:
        default: local

    dataSource:
        url: jdbc:mysql://host.docker.internal:3323/redis-1-db
        username: redis
        password: password
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
    
    data:
        redis:
            host: cache-server
            port: 6379

logging:
    level:
        org.springfaorwork.cache: debug

